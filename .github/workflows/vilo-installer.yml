
name: VILO - Instalator Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalacja i budowanie
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

          python -m PyInstaller --noconfirm --clean --onedir --windowed --name vilo-server --distpath backend-dist --collect-all uvicorn --collect-all fastapi --add-data "backend/static;static" --paths backend backend/backend_entry.py

          if ($LASTEXITCODE -ne 0) {
            throw "Blad budowania backendu"
          }

          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "Blad instalacji npm"
          }

          npm run dist:win -- --publish never

          if ($LASTEXITCODE -ne 0) {
            throw "Blad budowania instalatora"
          }

      - name: Pobierz instalator
        uses: actions/upload-artifact@v4
        with:
          name: VILO-Windows-Instalator
          path: release/VILO-Setup-*.exe
          if-no-files-found: error
